// PROVENANCE (NOTICE.md "whatsmeow rule" + provenance-recording policy):
//   - This schema is HAND-WRITTEN for this repository. No bytes were copied
//     from whatsmeow (MPL-2.0) or from any other upstream .proto file.
//   - Field roles (per-message ephemeral / static-key / opaque-payload byte
//     blobs inside clientHello / serverHello / clientFinish envelopes) were
//     learned read-only from the MIT-licensed Baileys sources at commit
//     0af2386: src/Socket/socket.ts (validateConnection builds
//     HandshakeMessage{ clientHello: { ephemeral } } and
//     HandshakeMessage{ clientFinish: { static, payload } }) and
//     src/Utils/noise-handler.ts (handshake-phase AEAD framing). The outer
//     field numbers follow Baileys WAProto/index.js at commit 0af2386:
//     HandshakeMessage.encode emits wire tags 18/26/34 (fields 2/3/4).
//     No whatsmeow bytes were involved.
//   - The handshake API boundary carries these payloads as OPAQUE byte blobs —
//     registration/login semantics belong to Phase 3 pairing, never to this file.
//
// SCOPE (02-03): minimal carrier for the Noise XX handshake only. The crypto
// tokens inside the fields are produced/consumed by the spec-faithful XX core
// in Noise/NoiseHandshake.cs (proven against cacophony vectors); this file
// defines the envelope, never the cryptography.
syntax = "proto3";

package wa.handshake;

option csharp_namespace = "Iwasug.WhatsApp.Sdk.Noise";

// One handshake message on the duplex channel. Exactly one of the three
// envelopes is populated per message: message A carries client_hello,
// message B carries server_hello, message C carries client_finish.
message HandshakeMessage {
  ClientHello client_hello = 2;
  ServerHello server_hello = 3;
  ClientFinish client_finish = 4;
}

// Message A (initiator -> responder, plaintext): fresh ephemeral public key
// plus the opaque client-hello blob (Phase 3 owns its semantics).
message ClientHello {
  bytes ephemeral = 1;
  bytes static_key = 2;
  bytes payload = 3;
}

// Message B (responder -> initiator): fresh ephemeral public key in the
// clear, then the AEAD-encrypted static key and encrypted opaque blob.
message ServerHello {
  bytes ephemeral = 1;
  bytes static_key = 2;
  bytes payload = 3;
}

// Message C (initiator -> responder): AEAD-encrypted static key and
// encrypted opaque finish blob. No ephemeral here (XX token flow: ->s, se).
message ClientFinish {
  bytes static_key = 1;
  bytes payload = 2;
}
