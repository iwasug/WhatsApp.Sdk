// pairing-code companion_reg flows (hello/finish) arrive in later plans.
syntax = "proto3";

package wa.pairing;

option csharp_namespace = "Iwasug.WhatsApp.Sdk.Pairing";

// Companion descriptor for registration. Encoded once by the factory and
// carried as opaque bytes in ClientPayload.DevicePairingData.device_props.
message DeviceProps {
  string os = 1;
  uint32 platform_type = 2;
  bool require_full_sync = 3;
  HistorySyncConfig history_sync_config = 4;
  AppVersion version = 5;

  message AppVersion {
    uint32 primary = 1;
    uint32 secondary = 2;
    uint32 tertiary = 3;
  }

  // History-sync capability flags, mirroring the roles Baileys sets on the
  // companion object. Fields Baileys leaves undefined stay unset here too.
  message HistorySyncConfig {
    uint32 storage_quota_mb = 1;
    bool inline_initial_payload_in_e2ee_msg = 2;
    bool support_call_log_history = 3;
    bool support_bot_user_agent_chat_history = 4;
    bool support_cag_reactions_and_polls = 5;
    bool support_biz_hosted_msg = 6;
    bool support_recent_sync_chunk_message_count_tuning = 7;
    bool support_hosted_group_msg = 8;
    bool support_fbid_bot_chat_history = 9;
    bool support_message_association = 10;
    bool support_group_history = 11;
  }
}
